name: "CI: Testing"

on:
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
        branches: [ core ]
    workflow_dispatch:

jobs:
    test-dotnet:
        name: .NET Testing
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        10.x
                        11.x

            -   name: Restore dependencies
                run: dotnet restore CodeOfChaos.Extensions.Testing.slnf

            -   name: Build
                run: dotnet build CodeOfChaos.Extensions.Testing.slnf --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution CodeOfChaos.Extensions.Testing.slnf --configuration Release --no-restore --no-build
              