name: "CI: Release"

on:
    workflow_dispatch:
        inputs:
            version_bump:
                description: 'Version bump type'
                required: true
                type: choice
                default: minor
                options:
                    - major
                    - minor
                    - patch
                    - preview
                    - custom
            custom_version:
                description: 'Custom version (only used if "custom" is selected)'
                required: false
                type: string
            publish_to_nuget:
                description: 'Publish to NuGet after building'
                type: boolean
                default: true

permissions:
    contents: write
    packages: write
    statuses: write
    checks: write
    pages: write
    id-token: write

jobs:
    test-dotnet:
        name: .NET Testing
        runs-on: ubuntu-latest
        
        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        10.x
                        11.x

            -   name: Restore dependencies
                run: dotnet restore CodeOfChaos.Extensions.Testing.slnf

            -   name: Build
                run: dotnet build CodeOfChaos.Extensions.Testing.slnf --configuration Release --no-restore

            -   name: Run tests
                run: dotnet test --solution CodeOfChaos.Extensions.Testing.slnf --configuration Release --no-restore --no-build
    
    bump-version:
        name: Bump Version
        runs-on: ubuntu-latest
        needs: [ test-dotnet ]
        
        permissions:
            contents: write
        
        outputs:
            new_version: ${{ steps.bump.outputs.version }}
            tag_name: ${{ steps.bump.outputs.tag }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    fetch-depth: 0
                    token: ${{ secrets.RELEASE_TOKEN }}

            -   name: Bump Version
                id: bump
                uses: Code-Of-Chaos/action-version-bumper@v2
                with:
                    version_file: src/Directory.Build.props
                    bump: ${{ inputs.version_bump }}
                    custom_version: ${{ inputs.custom_version }}
                    commit: 'true'
                    tag: 'true'
                    push: 'true'
    
    release:
        name: Release
        runs-on: ubuntu-latest
        needs: [ test-dotnet, bump-version ]
        
        env:
            TAG: ${{ needs.bump-version.outputs.tag_name }}
            VERSION: ${{ needs.bump-version.outputs.new_version }}
        
        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    ref: ${{ env.TAG }}
                    fetch-depth: 0

            -   name: Setup .NET
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: 11.x

            -   name: Restore dependencies
                run: dotnet restore CodeOfChaos.Extensions.Release.slnf

            -   name: Build
                run: dotnet build CodeOfChaos.Extensions.Release.slnf --configuration Release --no-restore /p:SolutionDir=${{ github.workspace }}/

            -   name: Pack
                run: dotnet pack CodeOfChaos.Extensions.Release.slnf --configuration Release -o ./release

            -   name: Upload NuGet Artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: nuget-packages-${{ env.TAG }}
                    path: ./release/*.nupkg

            -   name: Publish Release
                uses: softprops/action-gh-release@v3
                with:
                    tag_name: ${{ env.TAG }}
                    name: Release ${{ env.VERSION }}
                    generate_release_notes: true
                    files: ./release/*.nupkg
                    prerelease: ${{ contains(env.VERSION, 'preview') }}

            -   name: Push to NuGet
                if: ${{ inputs.publish_to_nuget }}
                env:
                    NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$NUGET_API_KEY" \
                      --source https://api.nuget.org/v3/index.json \
                      --skip-duplicate

            -   name: Push GitHub Packages
                if: ${{ inputs.publish_to_nuget }}
                env:
                    GITHUB_TOKEN: ${{ github.token }}
                run: |
                    dotnet nuget push "./release/*.nupkg" \
                      --api-key "$GITHUB_TOKEN" \
                      --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
                      --skip-duplicate